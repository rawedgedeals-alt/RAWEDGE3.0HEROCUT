name: Daily casino data audit
on:
  schedule:
    - cron: '23 13 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'casinos.json'
      - 'official-sources.json'
      - 'scripts/**'
      - '.github/workflows/casino-data-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate casino records and flag stale offers
        run: python scripts/validate_casinos.py
      - name: Check affiliate link reachability
        run: python scripts/check_casino_links.py
      - name: Build editorial review queue
        run: python scripts/build_review_queue.py
      - name: Restore previous official-source snapshots
        uses: actions/cache/restore@v4
        with:
          path: source-snapshots/
          key: source-snapshots-${{ github.run_id }}
          restore-keys: |
            source-snapshots-
      - name: Monitor approved official sources
        run: python scripts/monitor_official_sources.py
      - name: Persist official-source snapshots for future comparisons
        if: always()
        uses: actions/cache/save@v4
        with:
          path: source-snapshots/
          key: source-snapshots-${{ github.run_id }}
      - name: Save timestamped audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casino-daily-audit
          path: |
            audit-report.json
            review-queue.json
            source-change-report.json
            source-snapshots/
          if-no-files-found: warn
          retention-days: 30
