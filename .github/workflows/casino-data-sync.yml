name: RawEdge Verified Casino Data Sync
on:
  workflow_dispatch:
  schedule:
    - cron: '37 13 * * 1'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate and sync verified operator feeds
        run: python scripts/sync_verified_casinos.py
      - name: Commit verified data changes only
        run: |
          if ! git diff --quiet -- casinos.json; then
            git config user.name "rawedge-data-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add casinos.json
            git commit -m "Data: sync independently verified casino offers"
            git push
          fi
