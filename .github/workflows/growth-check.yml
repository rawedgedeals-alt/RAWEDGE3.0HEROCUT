name: Growth Pipeline QA
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'content/**'
      - 'articles/**'
      - 'insights.html'
      - 'sitemap.xml'
      - '.github/workflows/growth-*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Validate JavaScript
        run: |
          node --check scripts/generate.mjs
          node --check scripts/publish.mjs
      - name: Run dry pipeline without external credentials
        run: |
          node scripts/generate.mjs
          node scripts/publish.mjs
      - name: Assert readable output
        run: |
          test -s insights.html
          test -s articles/casino-bonus-wagering-requirements-explained.html
          grep -q 'insights.html' sitemap.xml
          grep -q 'wagering' insights.html
